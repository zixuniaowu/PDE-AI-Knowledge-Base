name: Weekly market data batch

on:
  schedule:
    - cron: "0 3 * * 1" # 每周一 12:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Collect market snapshot
        run: node scripts/collect-market-data.mjs

      - name: Commit and push data
        run: |
          git config user.name "market-batch"
          git config user.email "actions@users.noreply.github.com"
          git add data/market-history.json
          if git diff --cached --quiet; then
            echo "データ変更なし"
          else
            git commit -m "chore(data): weekly FDE market snapshot $(date +%F)"
            git push
            echo " pushed — Pages / HF デプロイが自動で走ります"
          fi
